spring:
  flyway:
    enabled: false
    clean-disabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
smartcart:
  sample-data: false
  import-starter-catalogue: false
  jwt-secret: ${JWT_SECRET}
  secure-cookies: true
  allowed-origins: ${ALLOWED_ORIGINS}
server:
  address: 0.0.0.0
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${CARTIQ_TRUSTED_PROXY_REGEX:127[.]0[.]0[.]1|::1}
  error:
    include-stacktrace: never
    include-binding-errors: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

