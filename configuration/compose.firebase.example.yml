services:
  backend:
    environment:
      FIREBASE_ENABLED: 'true'
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set the Firebase development project ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_adc
    secrets: [firebase_adc]

secrets:
  firebase_adc:
    file: ${FIREBASE_DEV_ADC_FILE:?Set the path to the approved development ADC file}
