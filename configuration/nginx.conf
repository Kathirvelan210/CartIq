log_format cartiq 'status=$status request_time=$request_time upstream_time=$upstream_response_time request_id=$upstream_http_x_request_id';

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 308 ${CARTIQ_HTTPS_ORIGIN}$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/cartiq-tls/fullchain.pem;
    ssl_certificate_key /etc/cartiq-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/access.log cartiq;
    # Native Nginx error messages can include request URLs. Backend logs supply sanitized diagnostics.
    error_log /dev/null crit;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cartiq_backend http://backend:8080;
        proxy_pass $cartiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 50s;
        proxy_next_upstream off;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }
}
